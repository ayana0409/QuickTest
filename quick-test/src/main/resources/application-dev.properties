# ===================================================================
# Quick Test Application - DEV / DEBUG Profile Configuration
# Activated with: --spring.profiles.active=dev
# ===================================================================

# Verbose Logging for Debugging
logging.level.root=INFO
logging.level.com.quicktest=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# SQL Query & Parameter Binding Logging
# Shows generated SQL and exact bound parameter values (? -> 'MATH10A')
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.type.descriptor.sql=TRACE

# JPA / Hibernate SQL formatting
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Display banner and debug info
debug=false
